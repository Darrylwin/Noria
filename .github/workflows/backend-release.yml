name: Backend Release

on:
  push:
    tags:
      - 'backend-v*'

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noria
          POSTGRES_PASSWORD: noria
          POSTGRES_DB: noria
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Prisma Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://noria:noria@localhost:5432/noria?schema=public"

      - name: Run Tests (Vitest)
        run: npm test
        env:
          NODE_ENV: test
          PORT: 3000
          DATABASE_URL: "postgresql://noria:noria@localhost:5432/noria?schema=public"
          FRONTEND_ORIGIN: "http://localhost:5173"

  release:
    name: Create GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tag Version
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#backend-v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Archive backend
        run: zip -r backend-v${{ env.VERSION }}.zip backend/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Backend Release v${{ env.VERSION }}
          body: |
            ### Backend Release v${{ env.VERSION }}
            Automated release for tag `${{ github.ref_name }}`.
          draft: false
          prerelease: false
          files: backend-v${{ env.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}