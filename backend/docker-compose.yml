services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: noria
      POSTGRES_PASSWORD: noria
      POSTGRES_DB: noria
    ports:
      - "5455:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://noria:noria@postgres:5432/noria?schema=public"
      PORT: 3000
    depends_on:
      - postgres

volumes:
  postgres_data: